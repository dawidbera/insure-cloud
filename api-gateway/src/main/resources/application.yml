server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:gateway.p12
    key-store-password: ${server.ssl.key-store-password}
    key-store-type: PKCS12
    key-alias: gateway

spring:
  application:
    name: api-gateway
  config:
    import: "optional:vault://"
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
  cloud:
    vault:
      uri: http://vault:8200
      token: root
      kv:
        enabled: true
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: policy-service
          uri: lb://policy-service
          predicates:
            - Path=/api/policies/**, /v3/api-docs/policy-service
          filters:
            - RewritePath=/v3/api-docs/policy-service, /v3/api-docs
        - id: quote-service
          uri: lb://quote-service
          predicates:
            - Path=/api/quotes/**, /v3/api-docs/quote-service
          filters:
            - RewritePath=/v3/api-docs/quote-service, /v3/api-docs
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/search/**, /v3/api-docs/search-service
          filters:
            - RewritePath=/v3/api-docs/search-service, /v3/api-docs
        - id: document-service
          uri: lb://document-service
          predicates:
            - Path=/api/documents/**, /v3/api-docs/document-service
          filters:
            - RewritePath=/v3/api-docs/document-service, /v3/api-docs
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**, /v3/api-docs/notification-service
          filters:
            - RewritePath=/v3/api-docs/notification-service, /v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Policy Service
        url: /v3/api-docs/policy-service
      - name: Quote Service
        url: /v3/api-docs/quote-service
      - name: Search Service
        url: /v3/api-docs/search-service
      - name: Document Service
        url: /v3/api-docs/document-service
      - name: Notification Service
        url: /v3/api-docs/notification-service

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/info
  client:
    registry-fetch-interval-seconds: 10
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER:http://discovery-service:8761/eureka/}
    eureka-server-read-timeout-seconds: 30
    eureka-server-connect-timeout-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
