# Search Service Configuration
spring:
  application:
    name: search-service
  config:
    import: "optional:vault://"
  cloud:
    vault:
      enabled: ${SPRING_CLOUD_VAULT_ENABLED:true}
      uri: ${SPRING_CLOUD_VAULT_URI:http://vault:8200}
      token: ${SPRING_CLOUD_VAULT_TOKEN:root}
      kv:
        enabled: true
    aws:
      sqs:
        endpoint: ${SPRING_CLOUD_AWS_ENDPOINT:http://localhost:4566}
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/insure-cloud}
  
  # Elasticsearch configuration
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}


server:
  port: 8085

# Logging configuration
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.insurecloud.search: DEBUG
    org.springframework.data.elasticsearch: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    serviceUrl:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
